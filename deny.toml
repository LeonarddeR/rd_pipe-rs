[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# The rd_pipe crate itself is AGPL-3.0-or-later but publish = false
private = { ignore = true }
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
