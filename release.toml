# cargo-release configuration for rd_pipe.
# The crate is a Windows DLL, not published to crates.io; cargo-release is used
# purely to bump the version, update Cargo.lock, stamp CHANGELOG.md, commit, and
# tag (v<version>). Pushing the tag triggers CI, which builds and publishes the
# GitHub release.

publish = false
push = true
tag = true
tag-name = "v{{version}}"
tag-message = "Release {{version}}"
pre-release-commit-message = "chore: release {{version}}"
allow-branch = ["master"]

# Local release gate: fmt, then clippy (warnings as errors), then the full test
# suite (cargo test builds the cdylib and runs unit + integration tests against
# it). cargo-release allows one hook command, so the three are chained via
# cmd /c.
pre-release-hook = [
    "cmd",
    "/c",
    "cargo fmt --all -- --check && cargo clippy --all-targets -- -D warnings && cargo test",
]

# Stamp the version/date into CHANGELOG.md on each release.
pre-release-replacements = [
    { file = "CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
]
